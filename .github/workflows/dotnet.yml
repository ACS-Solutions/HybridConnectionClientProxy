# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # Called by release.yml so a release is only built from a commit that passes the same build and tests
  # The caller must grant id-token: write (see release.yml)
  workflow_call:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for azure/login; only a master run's token is accepted (see below)

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    # The Azure integration tests sign in to the relay as managed identity id-hccp-ci (Azure Relay Sender on
    # clientportal/smtp4dev only), through its federated credential for this repository's master branch (#15).
    # No relay key is stored anywhere. Only master runs sign in: Entra accepts no other ref's token, so for a pull
    # request, another branch or a tag the tests skip. The ids below are not secrets.
    - name: Sign in to Azure (master only)
      if: github.ref == 'refs/heads/master'
      uses: azure/login@v3
      with:
        client-id: 3be288bd-8dfe-484c-9fab-2ae0bd7dec1e
        tenant-id: 317d17b3-e606-4ca4-924c-34fb9ad01b95
        allow-no-subscriptions: true
    - name: Configure the relay tests (master only)
      if: github.ref == 'refs/heads/master'
      run: |
        {
          echo "HCCP_TEST_AppSettings__Proxies__0__HybridConnectionString=Endpoint=sb://clientportal.servicebus.windows.net/;EntityPath=smtp4dev"
          echo "HCCP_TEST_AppSettings__EntraId__Method=AzureCli"
        } >> "$GITHUB_ENV"
    - name: Restore dependencies
      run: dotnet restore HybridConnectionClientProxy.slnx
    - name: Build
      run: dotnet build HybridConnectionClientProxy.slnx --no-restore
    - name: Test
      run: dotnet test --solution HybridConnectionClientProxy.slnx --no-restore
