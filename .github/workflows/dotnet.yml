# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # Called by release.yml so a release is only built from a commit that passes the same build and tests
  workflow_call:
    secrets:
      APPSETTINGS:
        required: false

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    # Only on master (its pushes, and release runs dispatched from it): a pull request's run, or a run on any
    # other branch or tag, executes code that hasn't been reviewed, which could read the relay key (#15).
    # Without the file the Azure integration tests skip.
    - name: Write test appsettings
      if: github.ref == 'refs/heads/master'
      env:
        APPSETTINGS: ${{ secrets.APPSETTINGS }}
      run: |
        if [ -n "$APPSETTINGS" ]; then
          echo "$APPSETTINGS" > HybridConnectionClientProxy.Tests/appsettings.Test.json
        fi
    - name: Restore dependencies
      run: dotnet restore HybridConnectionClientProxy.slnx
    - name: Build
      run: dotnet build HybridConnectionClientProxy.slnx --no-restore
    - name: Test
      run: dotnet test --solution HybridConnectionClientProxy.slnx --no-restore
